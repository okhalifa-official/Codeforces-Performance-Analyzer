name: Weekly Crawl & Retrain

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: "Crawl submissions from the last N days"
        required: false
        default: "7"
        type: string
      num_chunks:
        description: "Number of parallel crawl jobs"
        required: false
        default: "10"
        type: choice
        options: ["5", "10", "15", "20"]
      min_rating:
        description: "Minimum CF rating to include"
        required: false
        default: "900"
      max_rating:
        description: "Maximum CF rating to include"
        required: false
        default: "3500"

env:
  SINCE_DAYS:    ${{ github.event.inputs.since_days  || '7' }}
  NUM_CHUNKS:    ${{ github.event.inputs.num_chunks  || '10' }}
  CF_MIN_RATING: ${{ github.event.inputs.min_rating  || '900' }}
  CF_MAX_RATING: ${{ github.event.inputs.max_rating  || '3500' }}
  PYTHONUNBUFFERED: "1"

# ── Job 1: Fetch handles, split into chunks ───────────────────────────────────
jobs:
  setup:
    name: Fetch handles & split into chunks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip "requests~=2.32" "pandas~=2.3"

      - name: Download previous dataset (for new/known split)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ML/dataset ML/models
          LATEST=$(gh release list \
            --repo ${{ github.repository }} --limit 20 \
            --json tagName,isDraft \
            -q '[.[] | select(.isDraft == false) | select(.tagName | startswith("data-")) | .tagName] | .[0]' 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            echo "Previous dataset release: $LATEST"
            gh release download "$LATEST" \
              --repo ${{ github.repository }} \
              --pattern "dataset-*.tar.gz" \
              --dir /tmp/release-assets --clobber 2>/dev/null || true
            for f in /tmp/release-assets/dataset-*.tar.gz; do
              [ -f "$f" ] && tar -xzf "$f" -C ML/dataset/
            done
            # Fail fast (before the multi-hour crawl) if the release exists but
            # the dataset didn't extract — preprocessing needs these files later.
            [ -f ML/dataset/02_user_profiles.csv ] \
              || { echo "ERROR: $LATEST has no usable dataset-*.tar.gz (02_user_profiles.csv missing)"; exit 1; }
          fi
          ls -lh ML/dataset/ 2>/dev/null || echo "(empty)"

      - name: Split handles into chunks
        id: split
        run: |
          DATA_DIR=${{ github.workspace }} \
          SINCE_DAYS=${{ env.SINCE_DAYS }} \
          NUM_CHUNKS=${{ env.NUM_CHUNKS }} \
          CF_MIN_RATING=${{ env.CF_MIN_RATING }} \
          CF_MAX_RATING=${{ env.CF_MAX_RATING }} \
          python scripts/prepare_chunks.py | tee /tmp/prepare_output.txt

          # Extract the MATRIX= line printed by prepare_chunks.py
          MATRIX=$(grep '^MATRIX=' /tmp/prepare_output.txt | cut -d'=' -f2-)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

      - name: Upload chunks
        uses: actions/upload-artifact@v5
        with:
          name: chunks
          path: chunks/
          retention-days: 1

# ── Job 2: Parallel crawl matrix ─────────────────────────────────────────────
  crawl:
    name: Crawl chunk ${{ matrix.chunk }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # let other chunks finish even if one fails
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip "requests~=2.32" "pandas~=2.3"

      - name: Download chunks artifact
        uses: actions/download-artifact@v5
        with:
          name: chunks
          path: chunks/

      - name: Crawl chunk ${{ matrix.chunk }}
        run: |
          DATA_DIR=${{ github.workspace }} \
          SINCE_DAYS=${{ env.SINCE_DAYS }} \
          CHUNK_INDEX=${{ matrix.chunk }} \
          python scripts/crawl_chunk.py

      - name: Upload submissions for this chunk
        uses: actions/upload-artifact@v5
        with:
          name: submissions-${{ matrix.chunk }}
          path: chunks/submissions_${{ matrix.chunk }}.csv
          retention-days: 1

# ── Job 3: Merge all chunks, preprocess, retrain, release ────────────────────
  merge-and-retrain:
    name: Merge → Preprocess → Retrain → Release
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    # Step-level `if:` cannot read the secrets context (it invalidates the
    # whole workflow file, which silently stops the schedule), so expose
    # whether a database is configured through the job env instead.
    env:
      HAS_DB: ${{ secrets.DATABASE_PUBLIC_URL != '' || secrets.DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Download previous dataset + models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ML/dataset ML/models
          LATEST=$(gh release list \
            --repo ${{ github.repository }} --limit 20 \
            --json tagName,isDraft \
            -q '[.[] | select(.isDraft == false) | select(.tagName | startswith("data-")) | .tagName] | .[0]' 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            echo "Previous dataset release: $LATEST"
            gh release download "$LATEST" \
              --repo ${{ github.repository }} \
              --pattern "dataset-*.tar.gz" \
              --pattern "models-*.tar.gz" \
              --dir /tmp/release-assets --clobber 2>/dev/null || true
            for f in /tmp/release-assets/dataset-*.tar.gz; do
              [ -f "$f" ] && tar -xzf "$f" -C ML/dataset/
            done
            for f in /tmp/release-assets/models-*.tar.gz; do
              [ -f "$f" ] && tar -xzf "$f" -C ML/models/
            done
            # strength.py hard-requires this file; fail here with a clear message
            # instead of deep inside preprocessing.
            [ -f ML/dataset/02_user_profiles.csv ] \
              || { echo "ERROR: $LATEST has no usable dataset-*.tar.gz (02_user_profiles.csv missing)"; exit 1; }
          fi
          echo "--- Dataset ---"; ls -lh ML/dataset/ 2>/dev/null || echo "(empty)"
          echo "--- Models ---";  ls -lh ML/models/  2>/dev/null || echo "(empty)"

      - name: Download all chunk submissions
        uses: actions/download-artifact@v5
        with:
          pattern: submissions-*
          path: chunks/
          merge-multiple: true

      - name: List downloaded chunks
        run: ls -lh chunks/

      - name: Show runner resources
        run: |
          echo "--- memory ---"; free -h
          echo "--- swap (runners have none; overcommit is fatal) ---"; swapon --show || echo "(no swap)"
          echo "--- disk ---";   df -h /

      - name: Merge chunks + preprocess + retrain
        env:
          # Prefer the PUBLIC url: GitHub-hosted runners are outside Railway's
          # network, so the private .railway.internal host does not resolve
          # here (verified — it fails DNS). The web service keeps using the
          # private one. When neither is set the load step is skipped.
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          DATA_DIR=${{ github.workspace }} \
          NUM_CHUNKS=${{ env.NUM_CHUNKS }} \
          python scripts/merge_and_retrain.py

      - name: Report peak memory
        if: always()
        run: |
          echo "Peak RSS of the merge step, for tracking headroom against the 7 GB runner:"
          grep VmHWM /proc/self/status 2>/dev/null || true
          free -h

      - name: Package outputs
        run: |
          DATE=$(date -u +%Y%m%d)

          echo "--- Dataset files ---"; ls -lh ML/dataset/ 2>/dev/null || echo "(empty)"
          echo "--- Model files ---";  ls -lh ML/models/  2>/dev/null || echo "(empty)"

          [ "$(ls ML/dataset/*.csv 2>/dev/null | wc -l)" -gt 0 ] \
            || { echo "ERROR: No CSVs in ML/dataset/"; exit 1; }
          [ "$(ls ML/models/*.pkl 2>/dev/null | wc -l)" -gt 0 ] \
            || { echo "ERROR: No .pkl in ML/models/"; exit 1; }

          # Exclude the delta: it is a transient hand-off to the Postgres
          # loader, and its rows are already inside 04_filtered_submissions.csv.
          # Shipping it would inflate the release and risk a future restore
          # double-counting those submissions.
          tar -czf /tmp/dataset-${DATE}.tar.gz \
            --exclude='04_new_submissions_delta.csv' \
            -C ML/dataset .
          tar -czf /tmp/models-${DATE}.tar.gz  -C ML/models  .
          echo "DATE=${DATE}" >> $GITHUB_ENV
          ls -lh /tmp/dataset-${DATE}.tar.gz /tmp/models-${DATE}.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "Dataset & models — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes "Parallel crawl: ${{ env.NUM_CHUNKS }} jobs, last ${{ env.SINCE_DAYS }} days, rating ${{ env.CF_MIN_RATING }}–${{ env.CF_MAX_RATING }}" \
            --prerelease \
            /tmp/dataset-${DATE}.tar.gz \
            /tmp/models-${DATE}.tar.gz
          echo "Release published: $TAG"

      # Gate the redeploy on the database actually being current. Without this
      # a silently-failed load would still go green and the site would serve
      # stale data while every step reported success.
      - name: Verify Postgres matches the new dataset
        if: env.HAS_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: |
          DATA_DIR=${{ github.workspace }} python scripts/db/verify.py

      # Publishing the release is not enough to update the live site: Railway only
      # pulls new models at deploy time (scripts/start.sh → fetch_latest_release.sh),
      # and nothing else pushes to main. Poke the deploy hook so the fresh models
      # actually go live.
      # Two ways to redeploy, because Railway has moved this feature around:
      #  - RAILWAY_DEPLOY_HOOK: a webhook URL, if your project still offers
      #    Settings -> Deploy Triggers / Deploy Hooks.
      #  - RAILWAY_TOKEN (+ RAILWAY_SERVICE_ID): a project or account token,
      #    which works regardless of the dashboard layout. Get one from
      #    Railway -> project Settings -> Tokens.
      # Either is enough; the hook is tried first.
      - name: Trigger Railway redeploy
        env:
          DEPLOY_HOOK:  ${{ secrets.RAILWAY_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Using deploy hook."
            CODE=$(curl -sS -X POST --fail-with-body \
              -o /tmp/deploy_hook_response.txt -w '%{http_code}' \
              --retry 3 --retry-delay 10 --retry-all-errors \
              "$DEPLOY_HOOK") || {
                echo "ERROR: Railway deploy hook failed (HTTP ${CODE:-000})"
                cat /tmp/deploy_hook_response.txt 2>/dev/null
                exit 1
              }
            echo "Railway redeploy triggered (HTTP $CODE)."
            exit 0
          fi

          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_SERVICE_ID" ]; then
            echo "Using Railway API (serviceInstanceRedeploy)."
            # environmentId is required by the mutation; fall back to the
            # service's default environment when it is not pinned by secret.
            ENV_ID="$RAILWAY_ENVIRONMENT_ID"
            if [ -z "$ENV_ID" ]; then
              echo "ERROR: RAILWAY_ENVIRONMENT_ID is not set. Find it in the"
              echo "Railway URL: railway.com/project/<proj>/service/<svc>?environmentId=<this>"
              exit 1
            fi

            RESP=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --retry 3 --retry-delay 10 --retry-all-errors \
              -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\") }\"}" \
              https://backboard.railway.com/graphql/v2) || {
                echo "ERROR: Railway API call failed"; echo "$RESP"; exit 1
              }
            echo "$RESP"
            # GraphQL returns HTTP 200 even for errors, so inspect the body.
            case "$RESP" in
              *'"errors"'*) echo "ERROR: Railway API returned errors"; exit 1 ;;
            esac
            echo "Railway redeploy triggered via API."
            exit 0
          fi

          echo "ERROR: no redeploy credentials. The release was published but the"
          echo "live site will keep serving the old models."
          echo "Set RAILWAY_DEPLOY_HOOK, or RAILWAY_TOKEN + RAILWAY_SERVICE_ID +"
          echo "RAILWAY_ENVIRONMENT_ID. See DEPLOY.md."
          [ "${ALLOW_NO_REDEPLOY:-0}" = "1" ] && { echo "Continuing anyway."; exit 0; }
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: retrain-logs-${{ github.run_id }}
          path: |
            src/pipeline/logs/
            logs/
          retention-days: 30
